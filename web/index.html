<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f5f6f8"/>
  <meta name="description" content="产线硅基工程师 · 可追溯的工程分析工作台"/>
  <title>LINEA · 产线硅基工程师</title>
  <style>html{background:#f5f6f8;color-scheme:light}html[data-theme="dark"]{background:#0c0e13;color-scheme:dark}</style>
  <script>
    // Apply before the stylesheet and React load, without persisting the system default.
    (() => {
      let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try { const saved = localStorage.getItem('linea.theme'); if (saved === 'light' || saved === 'dark') theme = saved; } catch {}
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0c0e13' : '#f5f6f8');
    })();
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
