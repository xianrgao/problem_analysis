[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "line-engineer"
version = "1.0.0"
description = "Local manufacturing investigation workbench with auditable skill orchestration"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pandas>=2.2,<4", "numpy>=2.1,<3", "pyarrow>=19,<25",
  "scipy>=1.15,<2", "plotly>=6,<7", "httpx>=0.28,<1",
  "PyYAML>=6,<7", "python-multipart>=0.0.20,<1", "openpyxl>=3.1,<4",
  "psutil>=6,<8", "sqlglot>=26,<40"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
line-engineer = "line_engineer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/line_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
